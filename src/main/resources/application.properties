spring.application.name=GharSetuApplication


# ===============================
# Server Configuration
# ===============================
server.port=8090

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5440/ghar_setu
spring.datasource.username=postgres
spring.datasource.password=vijay
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=7FD1D7D1E52F5A7B93E812A6A4C3B4D5E6F71234567890ABCDEF123456789ABCD
jwt.expiration=86400000

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB